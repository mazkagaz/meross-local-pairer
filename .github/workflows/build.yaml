name: Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
      - run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: local-pairer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: local-pairer-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
