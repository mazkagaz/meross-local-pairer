name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Require stable signing secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing. Configure the signing secrets before releasing."
            exit 1
          fi

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/pairer-release.jks"

      - name: Build signed APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/pairer-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=(--notes "Meross Local Pairer build $GITHUB_REF_NAME")
          if [ -f RELEASE_NOTES.md ]; then
            NOTES=(--notes-file RELEASE_NOTES.md)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              app/build/outputs/apk/debug/app-debug.apk --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Meross Local Pairer $GITHUB_REF_NAME" "${NOTES[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              app/build/outputs/apk/debug/app-debug.apk \
              --title "Meross Local Pairer $GITHUB_REF_NAME" \
              "${NOTES[@]}"
          fi
