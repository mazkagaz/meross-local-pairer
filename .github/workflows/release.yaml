name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android

      - name: Require stable signing secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing. Configure the signing secrets before releasing."
            exit 1
          fi

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/pairer-release.jks"

      - name: Build signed APK
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/pairer-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '
            /^## / { if (found) exit; if ($2 == ver) found = 1 }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            printf 'Meross Local Pairer %s\n' "$GITHUB_REF_NAME" > "$NOTES_FILE"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              app/build/outputs/apk/release/Meross-Local-Pairer-*.apk --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Meross Local Pairer $GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" \
              app/build/outputs/apk/release/Meross-Local-Pairer-*.apk \
              --title "Meross Local Pairer $GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          fi
