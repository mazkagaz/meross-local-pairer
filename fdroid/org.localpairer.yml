AutoName: Meross Local Pairer
Summary: Pair Meross devices with a local MQTT broker
Description: |-
  Meross Local Pairer is an unofficial, local-only Android app that configures
  Meross devices to connect to a self-hosted MQTT broker instead of the Meross
  cloud. It is the pairing companion of the Meross Local Broker Home Assistant
  add-on.

  The app is used once to join a device to the LAN. It supports Wi-Fi AP
  pairing and Bluetooth LE provisioning for devices that expose it, with an
  HTTPS broker endpoint, certificate pinning and automatic mDNS discovery. The
  MRS100 is the reference test device; every other Meross model needs field
  testers.
  It requires a local broker and does not control devices by itself. It
  contains no ads, tracking or analytics and never contacts the Meross cloud.

